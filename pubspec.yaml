name: mendek_arena_masteran
description: Aplikasi Android masteran burung otomatis v3.3 dengan Auto-Sync Server & GitHub tanpa install ulang, 1-Tap In-App Updater, Media Sosial Komunitas, prakiraan cuaca BMKG besok, playlist multi-suara, dan Battery Guard.
publish_to: 'none'
version: 3.3.0+7

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.3
  flutter_timezone: ^3.0.1
  permission_handler: ^11.3.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: 2.1.3
  shared_preferences: 2.2.3
  http: ^1.2.1
  intl: ^0.19.0
  uuid: ^4.4.0
  url_launcher: 6.3.0
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.16.0
  video_player: 2.9.2
  youtube_explode_dart: ^3.0.0
  wakelock_plus: 1.2.5

dependency_overrides:
  package_info_plus: 8.0.2
  video_player_android: 2.7.13
  url_launcher_android: 6.3.10
  shared_preferences_android: 2.2.2
  path_provider_android: 2.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
